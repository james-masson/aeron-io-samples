---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aeron-io-sample-cluster
  labels:
    app.kubernetes.io/name: aeron-io-sample-cluster
    app.kubernetes.io/instance: aeron-io-sample-cluster
spec:
  replicas: 3
  podManagementPolicy: Parallel
  serviceName: aeron-io-sample-cluster
  selector:
    matchLabels:
      app.kubernetes.io/name: aeron-io-sample-cluster
      app.kubernetes.io/instance: aeron-io-sample-cluster
  volumeClaimTemplates:
  - metadata:
      name: data-volume-claim
    spec:
      accessModes: [ReadWriteOnce]
      # storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
  template:
    metadata:
      annotations:
        {}
      labels:
        app.kubernetes.io/name: aeron-io-sample-cluster
        app.kubernetes.io/instance: aeron-io-sample-cluster
        aeron.io/media-driver: "true"
    spec:
      serviceAccountName: aeron-io-sample-cluster
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      containers:
        - name: aeron-io-sample-cluster
          image: "cluster:latest"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
          args:
            - -c
            - /home/aeron/jar/entrypoint.sh -Dnode.id=${POD_NAME##*-}
          # -Daeron.driver.resolver.interface=0.0.0.0:8050 -Daeron.driver.resolver.name=cluster${POD_NAME##*-}
          # -Daeron.driver.resolver.bootstrap.neighbor=aeron-io-sample-cluster-0.aeron-io-sample-cluster.default.svc.cluster.local.:8050,aeron-io-sample-cluster-1.aeron-io-sample-cluster.default.svc.cluster.local.:8050,aeron-io-sample-cluster-2.aeron-io-sample-cluster.default.svc.cluster.local.:8050
          env:
            - name: DNS_DELAY
              value: "false"
            - name: K8S_DISCOVERY
              value: "true"
            - name: BASE_DIR
              value: "/home/aeron/jar/aeron-cluster"
            - name: CLUSTER_ADDRESSES
              # value: aeron-io-sample-cluster-0.aeron-io-sample-cluster.default.svc.cluster.local.,aeron-io-sample-cluster-1.aeron-io-sample-cluster.default.svc.cluster.local.,aeron-io-sample-cluster-2.aeron-io-sample-cluster.default.svc.cluster.local.
              value: aeron-io-sample-cluster-0,aeron-io-sample-cluster-1,aeron-io-sample-cluster-2
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /home/aeron/jar/aeron-cluster
              name: data-volume-claim
          resources:
            limits:
              memory: "1Gi"
              cpu: 1
            requests:
              memory: "1Gi"
              cpu: 1
        - name: debug
          image: "ubuntu"
          imagePullPolicy: IfNotPresent
          command:
            - sleep
          args:
            - infinity
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /home/aeron/jar/aeron-cluster
              name: data-volume-claim
          resources:
            limits:
              memory: "256Mi"
              cpu: "100m"
            requests:
              memory: "256Mi"
              cpu: "100m"