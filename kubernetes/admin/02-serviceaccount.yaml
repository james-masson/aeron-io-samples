---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aeron-io-sample-admin
  labels:
    app.kubernetes.io/name: aeron-io-sample-admin
    app.kubernetes.io/instance: aeron-io-sample-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aeron-io-sample-admin-pod-reader
  labels:
    app.kubernetes.io/name: aeron-io-sample-admin
    app.kubernetes.io/instance: aeron-io-sample-admin
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aeron-io-sample-admin-pod-reader-binding
  labels:
    app.kubernetes.io/name: aeron-io-sample-admin
    app.kubernetes.io/instance: aeron-io-sample-admin
subjects:
- kind: ServiceAccount
  name: aeron-io-sample-admin
  namespace: default
roleRef:
  kind: Role
  name: aeron-io-sample-admin-pod-reader
  apiGroup: rbac.authorization.k8s.io
