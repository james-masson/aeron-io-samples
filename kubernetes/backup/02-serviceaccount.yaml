---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aeron-io-sample-backup
  labels:
    app.kubernetes.io/name: aeron-io-sample-backup
    app.kubernetes.io/instance: aeron-io-sample-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aeron-io-sample-backup-pod-reader
  labels:
    app.kubernetes.io/name: aeron-io-sample-backup
    app.kubernetes.io/instance: aeron-io-sample-backup
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aeron-io-sample-backup-pod-reader-binding
  labels:
    app.kubernetes.io/name: aeron-io-sample-backup
    app.kubernetes.io/instance: aeron-io-sample-backup
subjects:
- kind: ServiceAccount
  name: aeron-io-sample-backup
roleRef:
  kind: Role
  name: aeron-io-sample-backup-pod-reader
  apiGroup: rbac.authorization.k8s.io
